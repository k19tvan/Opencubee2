# High-performance Nginx Gateway Configuration for OpenCubee2
# Isolates FastAPI backend, serves videos and keyframes via Kernel Zero-Copy (sendfile)

upstream backend_upstream {
    server host.docker.internal:3108;
    keepalive 32;
}

server {
    listen 2408;
    server_name localhost;

    # Performance Tuning for Bulk Media & Zero-Copy Streaming
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    sendfile_max_chunk 1m;
    client_max_body_size 64M;

    # Open File Descriptor Cache in RAM (drastically speeds up keyframe burst loading)
    open_file_cache max=50000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Compression for text, JSON, and scripts
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend Single Page App UI
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets (JS, CSS, SVGs)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Direct Zero-Copy Video Streaming with Byte-Range seeking support
    location /videos/ {
        alias /mlcv1/Datasets/HCMAI25/full/;
        try_files $uri $uri.mp4 $uri.mkv $uri.webm @backend_media;

        expires 30d;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Direct Keyframes Static Serving (with fallback to backend for multi-path resolution)
    location /keyframes/ {
        alias /GuestShare_NAS/WorkingSpace/Personal/nguyenmv/HCMAIC2026/AICHALLENGE_OPENCUBEE_2/results/keyframes_beit3_096/;
        try_files $uri $uri.webp $uri.jpg @backend_media;

        expires 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Internal Endpoint for FastAPI X-Accel-Redirect (Zero-Copy Kernel Offload)
    location /_internal_fs/ {
        internal;
        alias /;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        open_file_cache max=50000 inactive=60s;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # WebSocket Proxy for Realtime Collaboration
    location /ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Media Fallback Proxy (Resolves paths via FastAPI, which returns X-Accel-Redirect)
    location @backend_media {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Supported "1";
    }

    # API Proxy to Isolated FastAPI Backend
    location ~ ^/(search|temporal_search|search_semantic_asr|upload_image|proxy_image|google_images|enhance_query|similar|chatbot|video_info|video_thumbnail|check_temporal_frames|video_keyframes|video_timeline|models_status|agent|blacklist|image) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Supported "1";

        # Buffer tuning for fast API JSON responses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 300s;
    }
}
